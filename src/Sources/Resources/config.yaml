# Server port (CLIProxyAPI runs on 8318, ThinkingProxy forwards from 8317)
port: 8318

# Bind to localhost only for security (prevents exposure on public IPs)
host: 127.0.0.1

# Management API settings
remote-management:
  allow-remote: false
  secret-key: ""  # Leave empty to disable management API

# Authentication directory (stores OAuth tokens)
auth-dir: "~/.cli-proxy-api"

# Logging configuration
debug: false
logging-to-file: false

# Usage statistics
usage-statistics-enabled: true

# Network proxy (if needed for corporate networks)
proxy-url: ""

# Retry configuration
request-retry: 3

# Maximum number of different credentials to try for a single failed request.
# 0 removes the cap, so one inbound request sweeps every authenticated account
# before any error is returned to the local client. This is what makes
# multi-account failover invisible to Factory/Droid.
max-retry-credentials: 0

# Timeout for upstream provider requests
# Default: 10m. Set to "0" to disable timeout.
# Important for Extended Thinking requests which may take 5-10+ minutes.
request-timeout: "10m"

# ---------------------------------------------------------------------------
# The four values below are rewritten by the "Sequential account failover"
# setting in Settings. The values checked in here are the OFF state, i.e. the
# historical DroidProxy behavior. See ServerManager.accountFailoverOverrides
# for the exact substitutions; changing these lines means updating that table.
# ---------------------------------------------------------------------------

# Seconds to wait for the soonest cooling-down credential to recover before
# giving up on a request. 0 disables the wait entirely.
max-retry-interval: 0

# Disable global auth/model cooldown scheduling.
# Prevents long Factory/Droid sessions from hitting blackout windows where every
# Codex/Claude/Gemini auth shows as "auth_unavailable" after a single transient
# failure. See https://github.com/anand-92/droidproxy/issues/57.
disable-cooling: true

# Cooldown applied after a transient upstream error (408/500/502/503/504).
# 0 keeps the backend default (60s); -1 disables transient cooldowns entirely.
transient-error-cooldown-seconds: 0

# Routing strategy
routing:
  strategy: "round-robin"
  # Pin a session to one upstream auth so stateful Responses API traffic
  # (encrypted reasoning state, previous_response_id) does not break when a
  # follow-up turn would otherwise land on a different account. Affinity is
  # released automatically when the pinned auth fails, so failover still works.
  # See https://github.com/anand-92/droidproxy/issues/58.
  session-affinity: true
  session-affinity-ttl: "2h"

# Quota management
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# OAuth providers for local subscriptions
# Claude, Codex (GPT), Gemini tokens in ~/.cli-proxy-api/ will be used
# No fallback - users must authenticate providers they want to use

# No API keys needed for OAuth-based providers
generative-language-api-key: []
